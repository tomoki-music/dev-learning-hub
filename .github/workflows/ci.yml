name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # An ephemeral PostgreSQL database for this CI run only — not the
    # dev/preview/production Prisma Postgres databases. Credentials here are
    # throwaway (the container never leaves this job), so they don't need to
    # be GitHub Secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dev_learning_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A plain postgresql:// URL, so src/lib/prisma.ts connects via
      # @prisma/adapter-pg (not Prisma Accelerate — this container has no
      # Accelerate in front of it). Both variables point at the same
      # service container: there's no separate "pooled" endpoint to use
      # for DATABASE_URL here, unlike the real Prisma Postgres databases.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dev_learning_hub_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/dev_learning_hub_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
